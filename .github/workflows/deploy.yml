name: Deploy QR Redirects

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Redirect HTML Files
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          // 1. Baca links.json
          const links = JSON.parse(fs.readFileSync('links.json', 'utf8'));
          console.log('Jumlah link:', Object.keys(links).length);
          console.log('Data:', JSON.stringify(links, null, 2));

          // 2. Siapkan folder output
          const outputDir = './_site';
          fs.rmSync(outputDir, { recursive: true, force: true });
          fs.mkdirSync(outputDir, { recursive: true });

          // 3. Buat index.html root (WAJIB untuk GitHub Pages)
          const rootHtml = `<!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>QR Links</title></head>
          <body style="font-family:sans-serif;padding:2rem;">
            <h1>QR Redirect Service</h1>
            <p>Total links: ${Object.keys(links).length}</p>
            <ul>
              ${Object.entries(links).map(([slug, item]) =>
                `<li><strong>${slug}</strong> → <a href="${item.target_url}">${item.target_url}</a></li>`
              ).join('')}
            </ul>
          </body>
          </html>`;
          fs.writeFileSync(path.join(outputDir, 'index.html'), rootHtml);

          // 4. Generate redirect per slug di /r/{slug}/index.html
          for (const [slug, data] of Object.entries(links)) {
            // PERBAIKAN UTAMA: ambil dari data.target_url, BUKAN links.target_url
            const targetUrl = data && data.target_url;

            if (!targetUrl) {
              console.log(`SKIP ${slug}: target_url kosong`);
              continue;
            }

            console.log(`GENERATE ${slug} → ${targetUrl}`);

            const slugDir = path.join(outputDir, 'r', slug);
            fs.mkdirSync(slugDir, { recursive: true });

            const html = `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting...</title>
            <meta http-equiv="refresh" content="0; url=${targetUrl}">
            <link rel="canonical" href="${targetUrl}">
            <script>location.replace("${targetUrl}");</script>
          </head>
          <body style="font-family:sans-serif;padding:2rem;">
            <p>Mengalihkan ke <a href="${targetUrl}">${targetUrl}</a>...</p>
          </body>
          </html>`;

            fs.writeFileSync(path.join(slugDir, 'index.html'), html);
          }

          console.log('SELESAI. Cek folder _site/r/');
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
